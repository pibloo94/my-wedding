<div class="gate-overlay" [class.hiding]="hiding()">
  <!-- Soft paper background -->
  <div class="gate-bg"></div>

  <!-- Watercolor botanical framing, echoing the site sections -->
  <div class="botanical-corner corner-tl" aria-hidden="true"></div>
  <div class="botanical-corner corner-br" aria-hidden="true"></div>

  <div class="gate-content">
    <!-- Envelope -->
    <div class="envelope-wrapper fade-in-up" [class.opening]="opening()" [class.error]="error()" style="--delay:0.15s">

      <!-- Envelope body -->
      <div class="envelope">

        <!-- Back flap (behind content) -->
        <div class="envelope-back"></div>

        <!-- Content card (revealed on open) -->
        <div class="envelope-card">
          <div class="card-inner">
            <p class="card-tagline">{{ content.data().hero.name1 }} &amp; {{ content.data().hero.name2 }}</p>
            <div class="card-sprig" aria-hidden="true"></div>
            <p class="card-date">{{ content.data().hero.dateText }}</p>
          </div>
        </div>

        <!-- Side folds -->
        <div class="envelope-fold fold-left"></div>
        <div class="envelope-fold fold-right"></div>
        <div class="envelope-fold fold-bottom"></div>

        <!-- Top flap (animates open) -->
        <div class="envelope-flap"></div>

        <!-- Crest seal (moved out of flap to avoid clipping) -->
        <div class="wax-seal">
          <img class="seal-crest" src="assets/brand/crest-shield.webp" alt="" aria-hidden="true" />
        </div>

      </div>
    </div>

    <!-- Subtitle -->
    <p class="gate-subtitle fade-in-up" id="gate-help" style="--delay:0.3s">
      Introduce la contraseña para acceder a esta invitación
    </p>

    <!-- Password form -->
    <div class="gate-form fade-in-up" style="--delay:0.45s">
      <div class="input-wrapper" [class.shake]="error()">
        <label for="gate-password" class="sr-only">Contraseña de la invitación</label>
        <input
          id="gate-password"
          type="password"
          aria-describedby="gate-help"
          [attr.aria-invalid]="errorMsg() ? true : null"
          [ngModel]="password()"
          (ngModelChange)="onInput($event)"
          (keydown)="onKeydown($event)"
          placeholder="Contraseña"
          autocomplete="off"
          [attr.disabled]="opening() ? true : null"
        />
        <button class="unlock-btn" (click)="submit()" [disabled]="opening() || checking()" [attr.aria-busy]="checking() || null" aria-label="Entrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
      </div>

      <p class="error-hint" role="alert">{{ errorMsg() }}</p>
    </div>

  </div>
</div>
