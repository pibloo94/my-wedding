<nav class="navbar" [class.scrolled]="scrolled()" [class.menu-open]="menuOpen()">
  <div class="nav-inner container">

    <button class="nav-brand" (click)="scrollTo('hero')" aria-label="Ir al inicio">
      <span class="initials">{{ initial1 }}</span>
      <span class="ampersand">&amp;</span>
      <span class="initials">{{ initial2 }}</span>
    </button>

    <ul class="nav-links" id="nav-links" [class.open]="menuOpen()">
      @for (link of navLinks; track link.anchor) {
        <li>
          <button class="nav-link" (click)="scrollTo(link.anchor)">{{ link.label }}</button>
        </li>
      }
    </ul>

    <button class="hamburger" [class.active]="menuOpen()" (click)="toggleMenu()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="menuOpen()" aria-controls="nav-links">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</nav>
