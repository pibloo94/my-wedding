@if (isDev()) {
  <div class="env-badge" role="status">DEV · datos de prueba</div>
}

@if (!authenticated()) {
  <app-password-gate (unlocked)="siteReady.set(true)" (authenticated)="onAuthenticated()" />
}

<!-- La web solo se monta (y descarga sus imágenes) tras la contraseña -->
@if (siteReady()) {
<div class="site-wrapper" [class.revealed]="authenticated()">
  <app-navbar></app-navbar>
  <main>
    <app-hero></app-hero>
    <!-- Orden, visibilidad y secciones de texto: se configuran desde la app de gestión -->
    @for (section of content.visibleSections(); track section.id) {
      @switch (section.kind) {
        @case ('events') { <app-event-details></app-event-details> }
        @case ('needToKnow') { <app-need-to-know></app-need-to-know> }
        @case ('rsvp') { <app-rsvp></app-rsvp> }
        @case ('registry') { <app-registry></app-registry> }
        @case ('text') { <app-text-section [section]="section"></app-text-section> }
      }
    }
  </main>
  <app-footer></app-footer>
</div>
}
