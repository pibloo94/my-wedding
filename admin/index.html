<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5E6A49">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Gestión boda Daniela &amp; Pablo</title>
<style>
@font-face{font-family:'Butler';src:url(../fonts/Butler-Light.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Butler';src:url(../fonts/Butler-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Butler';src:url(../fonts/Butler-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
:root{
  /* Tokens tomados de src/styles.scss de la web */
  --primary:#B15C38;--primary-soft:#C98A69;--primary-deep:#97492A;
  --sage:#7E8C6A;--sage-deep:#5E6A49;--sage-light:#B9C2A8;
  --sand:#E7DCC4;--sand-deep:#D8C6A4;--orange:#CD8A52;--white:#FFFFFF;
  --bg:#F5EFE3;--bg-alt:#EFE7D6;--surface:#FBF7EF;
  --dark:#43473A;--text:#4C4E40;--muted:#6E6F59;--faint:#86876F;
  --line:rgba(126,140,106,.22);--line-strong:rgba(126,140,106,.38);
  --shadow:0 18px 50px -20px rgba(94,106,73,.28);--shadow-s:0 2px 10px rgba(94,106,73,.07);
  --r:16px;--r-s:10px;
  --serif:'Butler',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --side:256px;--bottom:0px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;color:var(--sage-deep);line-height:1.12;letter-spacing:.005em}
h1{font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:300}
h2{font-size:clamp(1.3rem,2.2vw,1.6rem)}
h3{font-size:1.15rem}
a{color:var(--sage-deep);text-decoration-color:var(--sand-deep);text-underline-offset:3px}
a:hover{color:var(--primary)}
.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#5E6A49;color:var(--sand);display:flex;flex-direction:column;padding:26px 16px 18px;isolation:isolate}
.side::after{content:"";position:absolute;inset:auto -40px -30px auto;width:220px;height:220px;background:var(--corner) no-repeat center/contain;opacity:.10;transform:scale(-1,-1);z-index:-1;pointer-events:none}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 6px 18px;border-bottom:1px solid rgba(231,220,196,.18);margin-bottom:12px;text-decoration:none;color:inherit}
.brand img{width:64px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.brand .nm{font-family:var(--serif);font-size:1.45rem;color:#fff;font-weight:300;line-height:1.1}
.brand .dt{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;opacity:.8}
.nav a{display:flex;align-items:center;gap:12px;color:var(--sand);text-decoration:none;padding:10px 12px;border-radius:12px;margin-top:2px;font-size:.94rem;transition:background .2s,color .2s}
.nav a .ic{font-size:18px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:var(--surface);color:var(--sage-deep);font-weight:600;box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.nav a.on .ic{color:var(--primary);opacity:1}
.nav .cnt{margin-left:auto;font-size:.7rem;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:20px}
.nav a.on .cnt{background:var(--bg-alt)}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(231,220,196,.18);font-size:.74rem;opacity:.85;line-height:1.45}
.side .foot a{color:#fff;display:flex;align-items:center;gap:8px;text-decoration:none;font-size:.9rem;margin-bottom:10px}
main{padding:34px clamp(18px,3.6vw,52px) 90px;max-width:1240px;width:100%;margin:0 auto}
.mtop,.tabbar{display:none}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--primary);font-weight:600;display:block;margin-bottom:6px}
.ph .sub{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.06rem;margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.sprig{height:26px;width:180px;background:var(--sprig) no-repeat left center/contain;opacity:.85;margin-top:8px}
.sec{margin-top:34px}
.sec>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec>.hd h2{display:flex;align-items:baseline;gap:10px}
.sec>.hd h2 small{font-family:var(--sans);font-size:.78rem;color:var(--muted);font-weight:400}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow-s);position:relative}
.card.flat{box-shadow:none}
.card h3{display:flex;align-items:center;gap:8px}
.card h3 .ic{color:var(--primary)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.muted{color:var(--muted)}.small{font-size:.84rem}.xs{font-size:.74rem}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-family:var(--serif);font-style:italic;padding:26px 16px;text-align:center}
.empty img{width:170px;opacity:.95}
.note{display:flex;gap:12px;align-items:flex-start;background:#F7EADC;border:1px solid #E8CDB4;color:#6b3a1f;border-radius:14px;padding:13px 16px;font-size:.88rem;margin:12px 0}
.note .ic{font-size:18px;margin-top:2px;color:var(--primary)}
.note.sage{background:#ECF0E3;border-color:#CCD5BC;color:#4a553a}.note.sage .ic{color:var(--sage-deep)}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:50px;padding:10px 20px;min-height:40px;font:600 .72rem var(--sans);letter-spacing:.15em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all .25s;white-space:nowrap;background:none}
.btn .ic{font-size:15px;stroke-width:2}
.btn.pri{background:var(--primary);color:#fff}.btn.pri:hover{background:var(--primary-deep);color:#fff;transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(177,92,56,.6)}
.btn.out{color:var(--sage-deep);border-color:var(--sand-deep);background:var(--surface)}.btn.out:hover{border-color:var(--sage);background:#fff;color:var(--sage-deep)}
.btn.ghost{color:var(--sage-deep);padding:8px 12px}.btn.ghost:hover{background:var(--bg-alt)}
.btn.sm{min-height:34px;padding:7px 14px;font-size:.66rem}
.btn.light{background:rgba(255,255,255,.75);color:var(--sage-deep);border-color:rgba(216,198,164,.8)}
.icb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.icb:hover{background:var(--bg-alt);color:var(--sage-deep)}.icb.d:hover{color:var(--primary-deep);background:#F6E2D6}
.icb .ic{font-size:17px}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:9px 12px;min-height:40px;outline:none;max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(126,140,106,.16)}
input[type=checkbox]{accent-color:var(--primary);width:18px;height:18px;min-height:0;padding:0;cursor:pointer}
input[type=color]{padding:3px;width:44px;height:40px;cursor:pointer}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.bar .sp{flex:1}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:12px;color:var(--faint);font-size:16px;pointer-events:none}
.search input{padding-left:36px;width:240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:40px;padding:6px 12px;font-size:.82rem;cursor:pointer;color:var(--text);min-height:34px}
.chip b{font-weight:600}
.chip.on{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* ---------- Badges, bars ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;padding:3px 10px;border-radius:50px;background:var(--bg-alt);color:var(--sage-deep);border:1px solid var(--line);white-space:nowrap;font-weight:500}
.b-ok{background:#E4EBD9;color:#4a5a37;border-color:#CCD8BB}
.b-warn{background:#F7E6D6;color:#8a4524;border-color:#EBCDB2}
.b-bad{background:#F3D6CA;color:#7d3216;border-color:#E5B9A7}
.b-mute{background:#EEEAE0;color:var(--muted)}
.prog{height:8px;border-radius:8px;background:var(--bg-alt);overflow:hidden;display:flex}
.prog>i{display:block;height:100%;background:var(--sage)}
.prog>i.p{background:var(--primary)}.prog>i.o{background:var(--orange)}.prog>i.s{background:var(--sand-deep)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- Dashboard ---------- */
.hero{overflow:hidden;padding:0;background:linear-gradient(120deg,#F1E6CF 0%,#EFE7D6 55%,#F6F0E4 100%);border-color:var(--sand-deep);min-height:250px;display:grid;grid-template-columns:minmax(0,1fr) auto}
.hero .in{padding:28px 30px 26px;position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
.hero .big{font-family:var(--serif);font-weight:300;font-size:clamp(4rem,9vw,6.4rem);color:var(--primary);line-height:.85;letter-spacing:-.02em}
.hero .big small{font-size:.26em;letter-spacing:.24em;text-transform:uppercase;color:var(--sage-deep);font-family:var(--sans);font-weight:600;margin-left:12px;vertical-align:.9em}
.hero .when{font-family:var(--serif);font-size:1.18rem;color:var(--sage-deep)}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.hero .meta .ic{color:var(--primary)}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hero .art{position:relative;width:300px;z-index:1}
.hero .art img.cr{position:absolute;right:26px;top:18px;width:210px;filter:drop-shadow(0 18px 30px rgba(94,106,73,.22))}
.hero .mnt{position:absolute;left:0;right:0;bottom:0;height:120px;background:var(--mountain) no-repeat center bottom/cover;opacity:.32;z-index:0;-webkit-mask-image:linear-gradient(to top,#000 30%,transparent);mask-image:linear-gradient(to top,#000 30%,transparent)}
.kpi{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
a.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow);color:inherit}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi .l{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .icw{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg-alt);color:var(--primary)}
.kpi .icw .ic{font-size:18px}
.kpi .n{font-family:var(--serif);font-size:2.3rem;color:var(--sage-deep);line-height:1;font-weight:300}
.kpi .n small{font-size:.45em;color:var(--muted);font-family:var(--sans);margin-left:4px}
.kpi .d{font-size:.8rem;color:var(--muted)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--sage) calc(var(--p)*1%),var(--bg-alt) 0);display:grid;place-items:center}
.ring::before{content:attr(data-v);width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 .82rem var(--sans);color:var(--sage-deep)}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:0;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 0 4px;scrollbar-width:thin}
.tl .ph2{scroll-snap-align:start;padding:14px 14px 12px;border-left:1px dashed var(--line-strong);position:relative}
.tl .ph2:first-child{border-left:0}
.tl .ph2 .dt{font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.tl .ph2 .nm{font-family:var(--serif);font-size:1.02rem;color:var(--sage-deep);margin:3px 0 8px;line-height:1.15}
.tl .ph2 .ct{font-size:.74rem;color:var(--muted);margin-top:6px}
.tl .ph2.now{background:linear-gradient(180deg,rgba(177,92,56,.08),transparent);border-radius:12px}
.tl .ph2.now .nm{color:var(--primary)}
.tl .ph2.now::before{content:"Ahora";position:absolute;top:-9px;left:14px;background:var(--primary);color:#fff;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding:2px 8px;border-radius:20px;font-weight:600}
.tl .ph2.past{opacity:.55}

/* ---------- Lists / tasks ---------- */
.list{list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .tt{font-weight:500;color:var(--dark)}
.row .sb{font-size:.78rem;color:var(--muted);margin-top:1px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 14px;align-items:start;padding:12px 18px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{margin-top:3px}
.task .tt{color:var(--dark);font-weight:500}
.task.done .tt{text-decoration:line-through;color:var(--faint);font-weight:400}
.task .sb{font-size:.78rem;color:var(--muted);margin-top:2px}
.task .when{text-align:right;white-space:nowrap}
.task .when .xs{display:block;color:var(--faint);margin-top:3px}
.task .ops{display:flex;gap:0}
.phase{margin-top:22px}
.phase>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.phase>summary::-webkit-details-marker{display:none}
.phase>summary h3{flex:1}
.phase>summary .chev{transition:transform .2s;color:var(--muted)}
.phase[open]>summary .chev{transform:rotate(90deg)}
.phase .card{padding:0;overflow:hidden}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 .78rem var(--sans);flex:none;letter-spacing:.02em}

/* ---------- Tables (data) ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-s)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-deep);background:var(--bg-alt);padding:11px 14px;white-space:nowrap;font-weight:600}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:#fff}
td.ra{white-space:nowrap;text-align:right;width:1%}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.who{display:flex;align-items:center;gap:12px}
.who b{color:var(--dark);font-weight:600}

/* ---------- Seating ---------- */
.seat-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.pool{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.pool h3{margin-bottom:4px}
.gchip{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;cursor:grab;font-size:.88rem;user-select:none;transition:box-shadow .2s,transform .2s}
.gchip:hover{box-shadow:var(--shadow-s);transform:translateY(-1px)}
.gchip .avatar{width:28px;height:28px;font-size:.66rem}
.gchip .plus{margin-left:auto;font-size:.72rem;color:var(--muted)}
.gchip.dragging{opacity:.4}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tcard{cursor:pointer;padding:14px 14px 16px;text-align:center;transition:transform .2s,box-shadow .2s,border-color .2s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard.drop{border-color:var(--primary);box-shadow:0 0 0 3px rgba(177,92,56,.18)}
.tcard .tsvg{width:100%;height:auto;max-height:200px;display:block;margin:0 auto}
.tcard .tn{font-family:var(--serif);font-size:1.12rem;color:var(--sage-deep);margin-top:4px}
.tcard .ts{font-size:.78rem;color:var(--muted);display:flex;justify-content:center;gap:8px;align-items:center;margin-top:2px}
.tcard.over{border-color:#E5B9A7}
.tdetail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.tdetail .tsvg{width:100%;height:auto;max-height:62vh;background:radial-gradient(circle at 50% 50%,#fff,var(--surface) 70%);border-radius:14px;border:1px solid var(--line);display:block}
svg text{font-family:var(--sans)}

/* ---------- Budget ---------- */
.donut{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut>svg{width:170px;height:170px;flex:none}
.donut .lg{flex:1;min-width:200px}
.donut .lg .row{padding:7px 0}
.sw-i{width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- Day timeline ---------- */
.vt{position:relative;padding-left:8px}
.vt .it{display:grid;grid-template-columns:92px 22px minmax(0,1fr) auto;gap:0 14px;align-items:start;padding:4px 0 18px;position:relative}
.vt .it::before{content:"";position:absolute;left:calc(92px + 14px + 10px);top:22px;bottom:-4px;width:1px;background:var(--line-strong)}
.vt .it:last-child::before{display:none}
.vt .hr{font-family:var(--serif);font-size:1.25rem;color:var(--primary);text-align:right;line-height:1.1}
.vt .hr small{display:block;font-family:var(--sans);font-size:.72rem;color:var(--muted)}
.vt .dt{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--sage);margin-top:2px;position:relative;z-index:1}
.vt .it.web .dt{border-color:var(--primary);background:#F7E6D6}
.vt .bx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.vt .bx b{color:var(--dark)}

/* ---------- Theme ---------- */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.swc{padding:0;overflow:hidden}
.swc .chipc{height:96px;border-bottom:1px solid var(--line);position:relative}
.swc .chipc span{position:absolute;left:12px;bottom:10px;font:600 .66rem var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.82);color:var(--sage-deep)}
.swc .bd{padding:12px 14px}
.swc .bd b{display:block;color:var(--dark)}
.swc .ctl{display:flex;gap:8px;margin-top:10px}
.swc .ctl input[type=text]{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem}

/* ---------- Web module ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin:4px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-size:.9rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs a.on{color:var(--sage-deep);border-bottom-color:var(--primary);font-weight:600}
.tabs a .badge{padding:0 7px;font-size:.66rem}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .st{flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.85rem;min-width:0}
.flow .st b{display:block;color:var(--dark);font-size:.88rem;margin-bottom:2px}

function migrate(o){
  const s=Object.assign(seed(),o);
  if(!o.v||o.v<2){
    s.v=2;s.webPlan=o.webPlan||seedPlan();
    s.config=Object.assign(seed().config,o.config||{});
    (s.tables||[]).forEach(t=>{t.shape=t.shape||'redonda'});
    delete s.webSections;
    (s.webLog||[]).forEach(l=>{if(/^Hecho en la web/.test(l.status||''))l.status='Publicado (comprobado en la web)'});
  }
  if(!s.v||s.v<3){
    s.v=3;
    s.guests=(s.guests||[]).map(g=>{
      if(Array.isArray(g.members))return g;
      const first=String(g.name||'').split(' ')[0];
      const members=[mkMember({role:'adulto',name:g.name,allergies:g.dietary||'',table:g.table||''})];
      if(g.partner)members.push(mkMember({role:'acompañante',name:g.partnerName||('Acompañante de '+first),table:g.table||''}));
      const {partner,partnerName,dietary,table,...rest}=g;
      return {...rest,contact:g.contact||g.email||g.phone||'',members};
    });
    const keep=(s.webPlan||[]).filter(p=>p.phase==='0'||p.status!=='Pendiente');
    s.webPlan=keep.concat(seedPlanFirebase().filter(n=>!keep.some(k=>k.title===n.title)));
  }
  return s;
}

function fieldHtml(f,v){
  const val=v??'';const nm=`name="${f.k}" id="f-${f.k}"`;const cls=f.full?'f full':'f';
  if(f.type==='check')return `<label class="${cls} ck"><input type="checkbox" ${nm} ${v?'checked':''}> <span>${esc(f.l)}</span></label>`;
  if(f.type==='ro')return `<div class="${cls}"><span>${esc(f.l)}</span><div class="ro">${esc(val)||'—'}</div></div>`;
  let h;
  if(f.type==='select'){const o=(typeof f.o==='function'?f.o():f.o).map(x=>Array.isArray(x)?x:[x,x]);
    h=`<select ${nm}>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(val)?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
  else if(f.type==='textarea')h=`<textarea ${nm}>${esc(val)}</textarea>`;
  else{const lid=f.list?`list="dl-${f.k}"`:'';
    h=`<input ${nm} type="${f.type||'text'}" value="${esc(val)}" ${f.type==='number'?`step="any" inputmode="decimal" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''}`:''} ${f.r?'required':''} ${lid}>`;
    if(f.list)h+=`<datalist id="dl-${f.k}">${f.list().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`}
  return `<label class="${cls}">${esc(f.l)}${h}${f.h?`<span class="hint">${esc(f.h)}</span>`:''}</label>`;
}

async function download(name,txt,type){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:txt});toast('Descargado: '+name)}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar el archivo en esta vista')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

const csvq=v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0]||'';
  const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===sep){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(x=>x.some(y=>y.trim()));
}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast('El CSV no tiene filas');return}
  const H=rows[0].map(norm);
  const ix={name:H.findIndex(h=>h==='nombre'),att:H.findIndex(h=>h.startsWith('asistencia')),
    hp:H.findIndex(h=>h.includes('acompa')&&!h.includes('nombre')),pn:H.findIndex(h=>h.includes('nombre')&&h.includes('acompa')),
    di:H.findIndex(h=>h.includes('alergia')||h.includes('dietar')),msg:H.findIndex(h=>h.includes('mensaje')),dt:H.findIndex(h=>h.startsWith('fecha'))};
  if(ix.name<0){toast('No encuentro la columna «Nombre»');return}
  let nw=0,up=0;
  rows.slice(1).forEach(r=>{
    const name=(r[ix.name]||'').trim();if(!name)return;
    const a=norm(r[ix.att]);const status=a.startsWith('si')?'confirmado':a.startsWith('no')?'rechazado':'pendiente';
    const partner=ix.hp>=0&&norm(r[ix.hp]).startsWith('si');
    const data={status,partner,partnerName:ix.pn>=0&&r[ix.pn]!=='-'?(r[ix.pn]||'').trim():'',dietary:ix.di>=0?(r[ix.di]||'').trim():'',message:ix.msg>=0?(r[ix.msg]||'').trim():'',rsvpDate:ix.dt>=0?(r[ix.dt]||'').trim():''};
    const ex=S.guests.find(g=>norm(g.name)===norm(name));
    const old=ex?mem(ex):[];const keepT=(nm,role)=>(old.find(m=>norm(m.name)===norm(nm))||old.find(m=>m.role===role)||{}).table||'';
    const members=[mkMember({role:'adulto',name,allergies:data.dietary,table:keepT(name,'adulto')})];
    if(partner)members.push(mkMember({role:'acompañante',name:data.partnerName||('Acompañante de '+name.split(' ')[0]),table:keepT(data.partnerName,'acompañante')}));
    const g={status,message:data.message,rsvpDate:data.rsvpDate,members};
    if(ex){Object.assign(ex,g);up++}else{S.guests.push({id:uid(),name,group:'RSVP web',contact:'',notes:'',source:'hoja',...g});nw++}
  });
  save();render();toast(`Importación: ${nw} nuevos, ${up} actualizados`);
}

/* =================== Dibujo de mesas (SVG) =================== */
function seatList(t){
  const out=[];attending().forEach(g=>{const c=colorOf(g.group||g.name);
    mem(g).filter(m=>m.table===t.id).forEach(m=>out.push({label:m.name+(m.role==='niño'&&m.age!==null&&m.age!==''?` (${m.age})`:''),ini:initials(m.name),c,diet:hasDiet(m),gid:g.id,plus:m.role!=='adulto'?1:0}))});
  return out;
}
function tableSVG(t,big){
  const cap=Math.max(1,Math.min(30,+t.cap||1)),seatsArr=seatList(t);const n=Math.max(cap,seatsArr.length);
  const cr=big?13:9.5,lab=big?120:0;let body='',vb;
  const chair=(x,y,s,i,ang)=>{
    const over=i>=cap;
    if(!s)return `<circle cx="${x}" cy="${y}" r="${cr}" fill="#fff" stroke="#D8C6A4" stroke-width="1.4" stroke-dasharray="3 2.4"/>`;
    let g=`<g><title>${esc(s.label)}</title><circle cx="${x}" cy="${y}" r="${cr}" fill="${s.c}" stroke="${over?'#7d3216':'#fff'}" stroke-width="${over?2.2:1.6}"/>`;
    g+=`<text x="${x}" y="${y}" fill="#fff" font-size="${big?9.5:7}" font-weight="600" text-anchor="middle" dominant-baseline="central">${esc(s.ini)}</text>`;
    if(s.diet)g+=`<circle cx="${x+cr*.72}" cy="${y-cr*.72}" r="${big?4:3}" fill="#CD8A52" stroke="#fff" stroke-width="1.2"/>`;
    if(big){const a=ang??0,lx=x+Math.cos(a)*(cr+7),ly=y+Math.sin(a)*(cr+7);const anc=Math.abs(Math.cos(a))<.3?'middle':Math.cos(a)>0?'start':'end';
      const txt=s.label.length>20?s.label.slice(0,19)+'…':s.label;
      g+=`<text x="${lx.toFixed(1)}" y="${(ly+(Math.abs(Math.cos(a))<.3?(Math.sin(a)>0?6:-2):3)).toFixed(1)}" fill="#43473A" font-size="10.5" text-anchor="${anc}" ${s.plus?'font-style="italic" fill-opacity=".8"':''}>${esc(txt)}</text>`}
    return g+'</g>';
  };
  const label=`<text x="0" y="${big?-4:-3}" text-anchor="middle" font-family="Butler,Georgia,serif" font-size="${big?17:12.5}" fill="#5E6A49">${esc(t.name.length>(big?22:13)?t.name.slice(0,big?21:12)+'…':t.name)}</text><text x="0" y="${big?15:11}" text-anchor="middle" font-size="${big?11:8.5}" fill="${seatsArr.length>cap?'#97492A':'#6E6F59'}" font-weight="600">${seatsArr.length}/${cap}</text>`;
  if(t.shape==='rectangular'||t.shape==='presidencial'){
    const one=t.shape==='presidencial';const per=one?n:Math.ceil(n/2);const step=cr*2+(big?10:7);
    const w=Math.max(per*step+12,big?150:110),h=one?(big?54:40):(big?70:50);
    body=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${big?14:10}" fill="#EFE7D6" stroke="#D8C6A4" stroke-width="1.5"/>`;
    for(let i=0;i<n;i++){const side=one?0:(i<per?0:1);const k=one?i:(i<per?i:i-per);const cnt=one?n:(side===0?per:n-per);
      const x=-((cnt-1)*step)/2+k*step,y=side===0?-h/2-cr-5:h/2+cr+5;body+=chair(x,y,seatsArr[i],i,side===0?-Math.PI/2:Math.PI/2)}
    const W=w/2+cr+10,Hh=h/2+cr*2+12;
    vb=big?`${-W-10} ${-Hh-(one?100:100)} ${2*W+100} ${2*Hh+(one?110:200)}`:`${-W} ${-Hh} ${2*W} ${2*Hh}`;
    if(big){/* etiquetas rotadas para que no se solapen */
      body=body.replace(/<text x="([-\d.]+)" y="([-\d.]+)" fill="#43473A" font-size="10.5" text-anchor="middle"/g,(m,x,y)=>`<text x="${x}" y="${y}" fill="#43473A" font-size="10.5" text-anchor="start" transform="rotate(${+y<0?-50:50} ${x} ${y})"`);
    }
  }else{
    const R=Math.max(big?46:30,n*(big?6.4:4.3)),D=R+cr+(big?7:5);
    body=`<circle cx="0" cy="0" r="${R}" fill="#EFE7D6" stroke="#D8C6A4" stroke-width="1.5"/><circle cx="0" cy="0" r="${R-6}" fill="none" stroke="#fff" stroke-opacity=".7"/>`;
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;body+=chair(Math.cos(a)*D,Math.sin(a)*D,seatsArr[i],i,a)}
    const E=D+cr+4+lab;vb=`${-E} ${-(D+cr+4+(big?26:0))} ${2*E} ${2*(D+cr+4+(big?26:0))}`;
  }
  return `<svg class="tsvg${big?' big':''}" viewBox="${vb}" role="img" aria-label="${esc(t.name)}: ${seatsArr.length} de ${cap} sillas ocupadas"><g class="fit">${body}${label}</g></svg>`;
}

  const free=attending().filter(g=>unseated(g).length).sort((a,b)=>a.name.localeCompare(b.name,'es'));

function donut(parts,size=170,th=22){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1,R=(size-th)/2,C2=2*Math.PI*R;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*C2;const s=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="${th}" stroke-dasharray="${Math.max(0,len-2)} ${C2}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(p.l)}: ${eur(p.v)}</title></circle>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#EFE7D6" stroke-width="${th}"/>${segs}</svg>`;
}

V.tasks=()=>{
  const f=UI.tf;let rows=S.tasks.slice();

  if(f.who)rows=rows.filter(t=>norm(t.who)===norm(f.who));
  const whos=[...new Set(S.tasks.map(t=>t.who).filter(Boolean))],cur=currentPhase();
  const groups=PHASES.map(p=>[p,rows.filter(t=>t.phase===p[0]).sort((a,b)=>dueOf(a)-dueOf(b))]).filter(g=>g[1].length);
  return `${head('Tareas','Planificación','Las fechas automáticas se recalculan si cambia la fecha de la boda',addBtn('tasks','Tarea'))}
  <div class="bar"><div class="chips">${[['pend','Pendientes'],['done','Hechas'],['','Todas']].map(([k,l])=>`<button class="chip ${f.st===k?'on':''}" data-act="tfst" data-k="${k}">${l}</button>`).join('')}</div><span class="sp"></span>
   <select data-change="tf" data-k="phase" aria-label="Fase"><option value="">Todas las fases</option>${PHASES.map(p=>`<option value="${p[0]}" ${f.phase===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>

  ${groups.map(([p,ts])=>{const all=S.tasks.filter(t=>t.phase===p[0]),dn=all.filter(t=>t.done).length;
    return `<details class="phase" open><summary>${ic('chev','chev')}<h3>${p[1]}${p[0]===cur?' <span class="badge b-warn" style="font-family:var(--sans);vertical-align:3px">Ahora</span>':''}</h3><span class="xs muted">${fd(addDays(wd(),-p[2]),{day:'numeric',month:'short',year:'numeric'})}</span><span class="badge">${dn}/${all.length}</span></summary><div class="card">${ts.map(taskRow).join('')}</div></details>`}).join('')||empty('No hay tareas con este filtro.')}`;
};

const COLLS=['guests','tables','expenses','vendors','tasks','day','logistics','inspo','webPlan','webChecks','webResources','webTexts','webInfo','webLog'];
const META_KEYS=['v','config','theme','webStatus','webStatusNote'];
const FB_VERSION='10.12.2';
function stable(v){
  if(Array.isArray(v))return '['+v.map(x=>stable(x===undefined?null:x)).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function contactKey(c){c=String(c||'').trim().toLowerCase();if(!c)return'';if(c.includes('@'))return'e:'+c;const d=c.replace(/\D/g,'');return d.length>=6?'p:'+d.slice(-9):''}
function hashStr(t){let h=2166136261>>>0;for(const ch of String(t)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36)}
function setSync(t){CLOUD.status=t;const el=$('#syncst');if(el)el.textContent=t}
function softRender(){if(!CLOUD.ready)return;if($('#dlg').open){CLOUD.pendingRender=true;return}render()}
function gate(st,msg=''){
  const g=$('#gate');if(!st){g.hidden=true;g.innerHTML='';return}
  const u=CLOUD.user;
  const body={
    loading:`<p class="sub">Conectando…</p>`,
    login:`<p class="small muted">Entra con una cuenta de Google que tenga acceso.</p><button class="btn pri" data-act="signIn">${ic('shield')} Entrar con Google</button>`,
    noaccess:`<p>La cuenta <b>${esc(u&&u.email||'')}</b> aún no tiene acceso.</p><p class="small muted">Para darla de alta: consola de Firebase → Firestore → colección <code>admins</code> → nuevo documento cuyo ID sea este:</p><div class="ro" style="word-break:break-all;margin:10px 0;font-family:ui-monospace,Menlo,monospace">${esc(u&&u.uid||'')}</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn out sm" data-act="copyUid">Copiar ID</button><button class="btn ghost sm" data-act="signOut">Usar otra cuenta</button></div><p class="xs muted" style="margin-top:12px">Después recarga esta página.</p>`,
    error:`<p>${esc(msg)}</p><button class="btn out" onclick="location.reload()">Reintentar</button>`
  }[st]||'';
  g.innerHTML=`<div class="gcard"><img src="${IMG.crest}" alt="" style="width:84px;margin:0 auto 12px"><h1>${esc(S.config.n1)} &amp; ${esc(S.config.n2)}</h1><span class="eyebrow" style="margin:8px 0 14px">Gestión privada</span>${body}</div>`;
  g.hidden=false;
}
async function cloudBoot(){
  let cfg=null;
  try{if(/^https?:$/.test(location.protocol)){const r=await fetch('../firebase-config.json',{cache:'no-store'});if(r.ok)cfg=await r.json()}}catch(e){}
  if(!cfg||!cfg.apiKey||!cfg.projectId)return; // modo local: datos en este navegador
  gate('loading');
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [APP,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=APP.initializeApp(cfg);const auth=A.getAuth(app);
    CLOUD.F=F;CLOUD.db=F.getFirestore(app);
    CLOUD.signIn=()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()).catch(e=>{if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('No se pudo iniciar sesión ('+(e.code||e.message)+')')});
    CLOUD.signOut=()=>A.signOut(auth).then(()=>location.reload());
    A.onAuthStateChanged(auth,async u=>{
      CLOUD.user=u;if(!u){gate('login');return}
      try{const adm=await F.getDoc(F.doc(CLOUD.db,'admins',u.uid));if(!adm.exists()){gate('noaccess');return}}catch(e){gate('noaccess');return}
      cloudStart().catch(e=>{console.error(e);gate('error','No se pudieron cargar los datos ('+(e.code||e.message)+').')});
    });
  }catch(e){console.error(e);gate('error','No se pudo cargar Firebase. Comprueba la conexión y vuelve a intentarlo.')}
}
async function cloudStart(){
  const F=CLOUD.F,db=CLOUD.db,metaRef=F.doc(db,'admin','state');
  COLLS.forEach(c=>CLOUD.synced[c]=new Map());
  const first=await F.getDoc(metaRef);
  CLOUD.on=true;
  if(!first.exists()){await pushDiff();toast('Primera vez: datos subidos a Firebase')}
  const applyColl=(c,arr)=>{CLOUD.synced[c]=new Map(arr.map(x=>[x.id,stable(x)]));S[c]=arr.map(({_i,...x})=>x)};
  F.onSnapshot(metaRef,d=>{CLOUD.loaded.add('meta');const x=d.data();
    if(x&&!CLOUD.dirty){CLOUD.meta=stable(x);META_KEYS.forEach(k=>{if(k in x)S[k]=x[k]});applyTheme();softRender()}maybeReady()},e=>setSync('Sin conexión'));
  COLLS.forEach(c=>F.onSnapshot(F.collection(db,'admin','state',c),qs=>{CLOUD.loaded.add(c);
    const arr=qs.docs.map(d=>d.data()).sort((a,b)=>(a._i??0)-(b._i??0));
    if(CLOUD.dirty)CLOUD.pendingSnap[c]=arr;else{applyColl(c,arr);softRender()}
    maybeReady()},e=>setSync('Sin conexión')));
  F.onSnapshot(F.collection(db,'rsvps'),qs=>{CLOUD.rsvps=qs.docs.map(d=>({id:d.id,...d.data()}));CLOUD.loaded.add('rsvps');maybeReady()},e=>console.warn('rsvps',e));
  CLOUD.applyColl=applyColl;
}
function maybeReady(){
  if(CLOUD.loaded.size<COLLS.length+2)return;
  if(!CLOUD.ready){CLOUD.ready=true;gate(null);setSync('Sincronizado');render()}
  mergeRsvps();
}
async function pushDiff(){
  clearTimeout(CLOUD.timer);CLOUD.timer=null;
  const F=CLOUD.F,db=CLOUD.db;if(!F)return;
  let batch=F.writeBatch(db),n=0;const commits=[],written=new Set();
  const flush=()=>{if(n){commits.push(batch.commit());batch=F.writeBatch(db);n=0}};
  const put=(ref,data)=>{batch.set(ref,data);if(++n>=450)flush()};
  const del=ref=>{batch.delete(ref);if(++n>=450)flush()};
  COLLS.forEach(c=>{
    const cur=new Map();(S[c]||[]).forEach((x,i)=>{if(!x.id)x.id=uid();cur.set(x.id,stable({...x,_i:i}))});
    const prev=CLOUD.synced[c]||new Map();
    cur.forEach((js,id)=>{if(prev.get(id)!==js){put(F.doc(db,'admin','state',c,id),JSON.parse(js));written.add(c)}});
    prev.forEach((_,id)=>{if(!cur.has(id)){del(F.doc(db,'admin','state',c,id));written.add(c)}});
    CLOUD.synced[c]=cur;
  });
  const m={};META_KEYS.forEach(k=>m[k]=S[k]);const mj=stable(m);
  if(mj!==CLOUD.meta){put(F.doc(db,'admin','state'),JSON.parse(mj));CLOUD.meta=mj}
  flush();CLOUD.dirty=false;
  Object.keys(CLOUD.pendingSnap).forEach(c=>{if(!written.has(c)&&CLOUD.applyColl)CLOUD.applyColl(c,CLOUD.pendingSnap[c])});CLOUD.pendingSnap={};
  try{await Promise.all(commits);setSync('Sincronizado')}
  catch(e){console.error(e);setSync('Error al guardar');toast('No se pudo guardar en Firebase ('+(e.code||e.message)+'). Revisa la conexión.')}
}
function rsvpsOf(g){if(!CLOUD.on||!g)return[];return CLOUD.rsvps.filter(r=>(g.rsvpId&&r.id===g.rsvpId)||(g.contactKey&&contactKey(r.contact)===g.contactKey))}
async function deleteRsvps(list){
  const F=CLOUD.F,db=CLOUD.db;if(!F||!list.length)return;
  const gone=new Set(list.map(r=>r.id));CLOUD.rsvps=CLOUD.rsvps.filter(r=>!gone.has(r.id));
  try{const b=F.writeBatch(db);list.forEach(r=>b.delete(F.doc(db,'rsvps',r.id)));await b.commit()}
  catch(e){console.error(e);toast('No se pudo borrar la respuesta en Firebase ('+(e.code||e.message)+')')}
}
/* Une las respuestas del formulario (colección rsvps) con las invitaciones, por correo o teléfono. */
function mergeRsvps(){
  if(!CLOUD.ready)return;
  const latest=new Map(),ids=new Set(CLOUD.rsvps.map(r=>r.id));
  CLOUD.rsvps.forEach(r=>{const k=contactKey(r.contact)||('n:'+norm(r.name));const cur=latest.get(k);if(!cur||String(r.submittedAt)>String(cur.submittedAt))latest.set(k,r)});
  let changed=0;
  latest.forEach((r,k)=>{
    const gid='w_'+hashStr(k);
    const g=S.guests.find(x=>x.id===gid)||S.guests.find(x=>x.contactKey===k)||S.guests.find(x=>!x.contactKey&&norm(x.name)===norm(r.name));
    if(g&&(g.rsvpId===r.id||(g.rsvpAt&&ids.has(g.rsvpId)&&String(g.rsvpAt)>=String(r.submittedAt))))return;
    const old=g?mem(g):[];
    const ppl=(Array.isArray(r.people)&&r.people.length?r.people:[{role:'adulto',name:r.name}]).slice(0,10);
    const members=ppl.map((p,i)=>{
      const prev=old.find(m=>norm(m.name)===norm(p.name))||(i===0?old[0]:null);
      const role=['adulto','acompañante','niño'].includes(p.role)?p.role:'adulto';
      return mkMember({id:prev?prev.id:uid(),table:prev?prev.table:'',role,name:String(p.name||'').slice(0,120),
        age:role==='niño'&&p.age!=null?Number(p.age):null,menu:role==='niño'?'':(p.menu==='vegetariano'?'vegetariano':'estandar'),
        gf:!!p.glutenFree,lf:!!p.lactoseFree,allergies:String(p.allergies||'').slice(0,300)})});
    const upd={name:String(r.name||'').slice(0,120),contact:String(r.contact||'').slice(0,120),contactKey:k,status:r.attending==='si'?'confirmado':'rechazado',
      message:String(r.message||'').slice(0,1000),rsvpAt:String(r.submittedAt||''),rsvpId:r.id,source:'web',members};
    if(g){if(!g.origin)g.origin=g.source==='web'?'web':(g.source||'manual');Object.assign(g,upd)}else S.guests.push({id:gid,group:'',notes:'',origin:'web',...upd});
    changed++;
  });
  // Respuestas borradas en Firestore: la invitación que venía solo de la web desaparece;
  // si la invitación existía antes a mano, se conserva y se desvincula.
  let removed=0;
  S.guests=S.guests.filter(g=>{
    if(g.source!=='web'||!g.rsvpId||ids.has(g.rsvpId))return true;
    if(latest.has(g.contactKey))return true;
    if(g.origin&&g.origin!=='web'){g.source=g.origin;g.status='pendiente';delete g.rsvpId;delete g.rsvpAt;removed++;return true}
    removed++;return false;
  });
  if(changed||removed){save();softRender();
    if(changed)toast(changed===1?'1 respuesta nueva de la web':`${changed} respuestas nuevas de la web`);
    else toast(removed===1?'1 respuesta borrada en Firebase':`${removed} respuestas borradas en Firebase`)}
}

/* =================== Navegación =================== */
const NAV=[['dashboard','Inicio','home'],['guests','Invitados','users'],['tables','Mesas','table'],['budget','Presupuesto','wallet'],['vendors','Proveedores','brief'],['tasks','Tareas','check'],['day','Día de la boda','clock'],['theme','Temática','palette'],['web','Web de la boda','globe'],['settings','Configuración','gear']];
const TAB=['dashboard','guests','tables','tasks'];
function route(){return V[UI.route]?UI.route:'dashboard'}
function go(r){UI.route=r;if($('#dlg').open)$('#dlg').close();render();scrollTo(0,0)}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||a.dataset.act)return;e.preventDefault();go(a.getAttribute('href').replace(/^#\/?/,''))});
function renderMain(){$('#main').innerHTML=V[route()]();bindDnD()}
function render(){
  const r=route(),c=S.config;
  const counts={guests:S.guests.length||'',tasks:S.tasks.filter(t=>!t.done&&dueOf(t)<today()).length||''};
  $('#side').innerHTML=`<a class="brand" href="#dashboard"><img src="${IMG.crest}" alt=""><span class="nm">${esc(c.n1)} &amp; ${esc(c.n2)}</span><span class="dt">${fd(wd(),{day:'numeric',month:'short',year:'numeric'})}</span></a>
   <nav class="nav">${NAV.map(([k,l,i])=>`<a href="#${k}" class="${k===r?'on':''}" title="${l}" ${k===r?'aria-current="page"':''}>${ic(i)}<span class="lb">${l}</span>${counts[k]?`<span class="cnt">${counts[k]}</span>`:''}</a>`).join('')}</nav>
   <div class="foot">${safeUrl(c.publicUrl)?`<a href="${esc(c.publicUrl)}" target="_blank" rel="noopener noreferrer" title="Web pública">${ic('ext')}<span>Web pública</span></a>`:''}${CLOUD.on?`<div class="tx"><span id="syncst">${esc(CLOUD.status||'Sincronizado')}</span><br>${esc((CLOUD.user&&CLOUD.user.email)||'')}</div><button class="btn ghost sm" data-act="signOut" style="color:var(--sand);padding:6px 0">Salir</button>`:`<div class="tx">Privado · los datos no salen de este navegador</div>`}</div>`;
  $('#mtop').innerHTML=`<img src="${IMG.crest}" alt=""><div class="nm">${esc(c.n1)} &amp; ${esc(c.n2)}<small>${(NAV.find(n=>n[0]===r)||[])[1]||''}</small></div>${safeUrl(c.publicUrl)?`<a class="icb" href="${esc(c.publicUrl)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir la web pública">${ic('globe')}</a>`:''}`;
  $('#tabbar').innerHTML=TAB.map(k=>{const n=NAV.find(x=>x[0]===k);return `<a href="#${k}" class="${k===r?'on':''}">${ic(n[2])}<span>${k==='dashboard'?'Inicio':n[1]}</span></a>`}).join('')+`<button data-act="more" class="${TAB.includes(r)?'':'on'}">${ic('more')}<span>Más</span></button>`;
  renderMain();
  document.title=`${(NAV.find(n=>n[0]===r)||[])[1]} · ${c.n1} & ${c.n2}`;
}
function bindDnD(){
  document.querySelectorAll('.gchip[draggable]').forEach(ch=>{
    ch.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',ch.dataset.gid);ch.classList.add('dragging')});
    ch.addEventListener('dragend',()=>ch.classList.remove('dragging'))});
  document.querySelectorAll('[data-drop]').forEach(t=>{
    t.addEventListener('dragover',e=>{e.preventDefault();t.classList.add('drop')});
    t.addEventListener('dragleave',()=>t.classList.remove('drop'));
    t.addEventListener('drop',e=>{e.preventDefault();t.classList.remove('drop');const g=S.guests.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(g)assign(g,t.dataset.drop)})});
  document.querySelectorAll('.tcard').forEach(t=>t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tableDlg(t.dataset.id)}}));
}
document.documentElement.lang='es';
applyTheme();render();
$('#dlg').addEventListener('close',()=>{if(CLOUD.pendingRender){CLOUD.pendingRender=false;render()}});
cloudBoot();
