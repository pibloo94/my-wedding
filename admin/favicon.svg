<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Escudo Daniela y Pablo">
  <defs>
    <clipPath id="shield">
      <path d="M32 4 L56 11 V32 C56 47 45 55 32 60 C19 55 8 47 8 32 V11 Z"/>
    </clipPath>
  </defs>

  <!-- Shield body (arena / warm white) -->
  <path d="M32 4 L56 11 V32 C56 47 45 55 32 60 C19 55 8 47 8 32 V11 Z"
        fill="#FBF7EF" stroke="#B15C38" stroke-width="2.4"/>

  <!-- Inner dotted rule, echoing the crest border -->
  <g clip-path="url(#shield)">
    <path d="M32 9 L51 14.5 V32 C51 44 42.5 50.5 32 55 C21.5 50.5 13 44 13 32 V14.5 Z"
          fill="none" stroke="#D8C6A4" stroke-width="1.4" stroke-dasharray="0.4 3.1"
          stroke-linecap="round"/>
  </g>

  <!-- Intertwined D · P monogram (terracotta) -->
  <text x="32" y="41" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="600"
        font-size="26" letter-spacing="-2" fill="#B15C38">DP</text>

  <!-- Little azahar dot accent -->
  <circle cx="32" cy="49.5" r="1.4" fill="#CD8A52"/>
</svg>
